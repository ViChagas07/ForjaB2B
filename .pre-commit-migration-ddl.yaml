# .pre-commit-config.yaml
# Adicione este hook ao seu .pre-commit-config.yaml existente
# ou crie este arquivo se nao existir.

repos:
  - repo: local
    hooks:
      - id: check-migration-ddl
        name: Check migration DDL on pre-existing tables
        entry: python scripts/check_migration_ddl.py
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        description: "Verifica se migrations fazem DDL em tabelas pre-existentes"