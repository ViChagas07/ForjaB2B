# ==============================================================================
# Forja B2B — Docker Compose Orchestration (Local & Development)
# ==============================================================================
# Serviços:
#  - postgres: PostgreSQL 16 com RLS e init-roles script
#  - redis: Cache, Celery backend e Rate Limiter
#  - rabbitmq: Broker de Mensageria e Filas Celery
#  - mailpit: Servidor SMTP fake e Web UI para inspecionar e-mails
#  - elasticsearch: Motor de busca e catálogo
#  - otel-collector: Coletor OpenTelemetry (OTLP gRPC/HTTP -> Prometheus/Logs)
#  - prometheus: Time-series database para métricas
#  - grafana: Dashboards e visualização de métricas/alertas
#  - backend: API FastAPI (Python 3.12)
#  - celery-worker: Processamento assíncrono de tarefas (Celery)
#  - frontend: Aplicação Next.js 14+ standalone
# ==============================================================================

networks:
  forja-network:
    name: forja-network
    driver: bridge

volumes:
  postgres_data:
    name: forja_postgres_data
  redis_data:
    name: forja_redis_data
  rabbitmq_data:
    name: forja_rabbitmq_data
  elasticsearch_data:
    name: forja_elasticsearch_data
  prometheus_data:
    name: forja_prometheus_data
  grafana_data:
    name: forja_grafana_data

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 (Relational Database)
  # ----------------------------------------------------------------------------
  postgres:
    # Fase 5: mesma major 16, agora com a extensao pgvector 0.8.7 embutida.
    # O formato fisico do PostgreSQL 16 e estavel entre minors, entao o volume
    # existente e reaproveitado sem recriacao. Faca um backup logico (pg_dump)
    # antes de subir esta versao em um ambiente com dados (ver docs/STATUS.md).
    image: pgvector/pgvector:0.8.7-pg16
    container_name: forja-postgres
    restart: unless-stopped
    environment:
      # Credencial elevada APENAS para o initdb do cluster; nunca exposta ao
      # backend/worker (esses servicos recebem somente variaveis explicitas).
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-forja_bootstrap_secret_dev}
      POSTGRES_DB: ${POSTGRES_DB:-forja_db}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-forja_admin}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-forja_admin_secret_dev}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-forja_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-forja_app_secret_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Wrappers .sh executam na ordem numerica e invocam os SQLs em sql/ com
      # as credenciais do ambiente (a imagem nao executa .sql de subdiretorios).
      - ./docker/postgres/01-init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
      - ./docker/postgres/02-rls-setup.sh:/docker-entrypoint-initdb.d/02-rls-setup.sh:ro
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/sql/init-roles.sql:ro
      - ./docker/postgres/02-rls-setup.sql:/docker-entrypoint-initdb.d/sql/02-rls-setup.sql:ro
    networks:
      - forja-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_BOOTSTRAP_USER:-postgres} -d ${POSTGRES_DB:-forja_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Redis 7 (Cache, Sessions & Rate Limiter)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: forja-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - forja-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  # ----------------------------------------------------------------------------
  # RabbitMQ 3.13 (Message Broker)
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: forja-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672" # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - forja-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Mailpit (Local SMTP Server & Web Inspector)
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.18
    container_name: forja-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP Port
      - "${MAILPIT_WEB_PORT:-8025}:8025"  # Web UI
    networks:
      - forja-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1025 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s

  # ----------------------------------------------------------------------------
  # Elasticsearch 9 (Search & Analytics)
  # ----------------------------------------------------------------------------
  # Seguranca LIGADA (xpack.security) com autenticacao por senha vinda do
  # ambiente. Em desenvolvimento usa-se HTTP sem TLS APENAS na rede interna do
  # Docker (a porta e publicada somente em loopback); TLS e obrigatorio em
  # producao (Fase 6). O backend NAO depende deste servico para iniciar (modo
  # degradado se estiver fora) e usa um volume nomeado proprio — nunca reutiliza
  # volumes de outros servicos.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: forja-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      # Decisao de dev: sem TLS no HTTP/transporte interno (rede do Docker), mas
      # COM autenticacao. Producao exige TLS (Fase 6).
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required (see .env.example)}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      # Publica SOMENTE no loopback do host; containers acessam pela rede interna.
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - forja-network
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 -u elastic:$${ELASTIC_PASSWORD} 'http://localhost:9200/_cluster/health?wait_for_status=yellow' > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ----------------------------------------------------------------------------
  # OpenTelemetry Collector (Contrib)
  # ----------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: forja-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics exporter
      - "13133:13133" # Health check extension
    networks:
      - forja-network
    # A imagem oficial e `FROM scratch`: nao existe shell, curl nem wget, e o
    # upstream nao distribui um binario /healthcheck (issue #30798). O unico
    # executavel disponivel e /otelcol-contrib, portanto o healthcheck usa o
    # proprio binario do collector para validar a configuracao efetiva que o
    # processo em execucao carrega (readiness). O endpoint de liveness real
    # (extensao health_check em :13133) permanece exposto para sondagem externa.
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Prometheus (Metrics Storage & Scraper)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: forja-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - forja-network
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:9090/-/healthy | grep -q 'Prometheus Server is Healthy' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Grafana (Metrics & Dashboards Visualization)
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: forja-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_dev_secret}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: "dark"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - forja-network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Backend API (FastAPI)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forja-backend
    restart: unless-stopped
    # Endurecimento: rootfs somente leitura (nada grava em disco em runtime),
    # sem ganho de privilegios e sem capabilities Linux.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    # Sem env_file: o backend recebe SOMENTE as variaveis explicitas abaixo.
    # Credenciais de bootstrap (POSTGRES_BOOTSTRAP_*) e de migracao
    # (POSTGRES_ADMIN_*/DATABASE_ADMIN_URL) ficam fora do runtime.
    environment:
      PORT: 8000
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-forja_app}:${POSTGRES_APP_PASSWORD:-forja_app_secret_dev}@postgres:5432/${POSTGRES_DB:-forja_db}
      DATABASE_ADMIN_URL: postgresql+asyncpg://${POSTGRES_ADMIN_USER:-forja_admin}:${POSTGRES_ADMIN_PASSWORD:-forja_admin_secret_dev}@postgres:5432/${POSTGRES_DB:-forja_db}
      REDIS_HOST: redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_HOST: rabbitmq
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required (see .env.example)}
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
      ELASTICSEARCH_INDEX_VERSION: ${ELASTICSEARCH_INDEX_VERSION:-2}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-forja-backend}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required (see .env.example)}
      PEPPER: ${PEPPER:?PEPPER is required (see .env.example)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (see .env.example)}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev_payment_webhook_secret_change_in_production}
      PIX_DISCOUNT_RATE: ${PIX_DISCOUNT_RATE:-0.05}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3010}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      CORS_MAX_AGE_SECONDS: ${CORS_MAX_AGE_SECONDS:-600}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      LOGIN_FAILURE_THRESHOLD: ${LOGIN_FAILURE_THRESHOLD:-3}
      LOGIN_FAILURE_WINDOW_SECONDS: ${LOGIN_FAILURE_WINDOW_SECONDS:-900}
      LOGIN_FAILURE_BASE_BACKOFF_SECONDS: ${LOGIN_FAILURE_BASE_BACKOFF_SECONDS:-30}
      LOGIN_FAILURE_MAX_BACKOFF_SECONDS: ${LOGIN_FAILURE_MAX_BACKOFF_SECONDS:-900}
      SECURITY_HSTS_ENABLED: ${SECURITY_HSTS_ENABLED:-true}
      SECURITY_HSTS_MAX_AGE_SECONDS: ${SECURITY_HSTS_MAX_AGE_SECONDS:-31536000}
      SECURITY_HSTS_INCLUDE_SUBDOMAINS: ${SECURITY_HSTS_INCLUDE_SUBDOMAINS:-true}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev_admin_api_key_change_in_production}
      # Com LLM local, use 1 worker: o semaforo do cliente e por processo.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      # IA local (LM Studio no host) e kill switches. LLM_BASE_URL_DOCKER e
      # separado de LLM_BASE_URL para o backend via Docker usar o gateway do
      # host sem quebrar quem roda o backend direto (localhost).
      AI_AGENTS_ENABLED: ${AI_AGENTS_ENABLED:-false}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:1235/v1}
      LLM_API_KEY: ${LLM_API_KEY:-lm-studio}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.5-9b}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_ROUTER_TIMEOUT_SECONDS: ${LLM_ROUTER_TIMEOUT_SECONDS:-20}
      LLM_ANSWER_TIMEOUT_SECONDS: ${LLM_ANSWER_TIMEOUT_SECONDS:-60}
      LLM_REGENERATION_TIMEOUT_SECONDS: ${LLM_REGENERATION_TIMEOUT_SECONDS:-20}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-1}
      LLM_QUEUE_SIZE: ${LLM_QUEUE_SIZE:-2}
      LLM_QUEUE_TIMEOUT_SECONDS: ${LLM_QUEUE_TIMEOUT_SECONDS:-10}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
      LLM_HEALTH_CACHE_SECONDS: ${LLM_HEALTH_CACHE_SECONDS:-30}
      LLM_HEALTH_TIMEOUT_SECONDS: ${LLM_HEALTH_TIMEOUT_SECONDS:-3}
      AI_DAILY_TOKEN_BUDGET: ${AI_DAILY_TOKEN_BUDGET:-200000}
      AI_CHAT_MAX_MESSAGE_CHARS: ${AI_CHAT_MAX_MESSAGE_CHARS:-500}
      AI_CHAT_HISTORY_TURNS: ${AI_CHAT_HISTORY_TURNS:-6}
      AI_CHAT_PROMPT_VERSION: ${AI_CHAT_PROMPT_VERSION:-v2}
      AI_CHAT_MAX_TOKENS_BY_LANGUAGE: ${AI_CHAT_MAX_TOKENS_BY_LANGUAGE:-{}}
      AI_PRICE_SCAN_LIMIT: ${AI_PRICE_SCAN_LIMIT:-500}
      AI_SESSION_TTL_SECONDS: ${AI_SESSION_TTL_SECONDS:-1800}
      AI_SESSION_MAX_CHARS: ${AI_SESSION_MAX_CHARS:-2000}
      AI_CONVERSATION_TTL_DAYS: ${AI_CONVERSATION_TTL_DAYS:-30}
      AI_CHAT_CLEANUP_BATCH: ${AI_CHAT_CLEANUP_BATCH:-500}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      EMAIL_DRY_RUN: ${EMAIL_DRY_RUN:-false}
    ports:
      - "8000:8000"
    # LM Studio roda no HOST. Dentro do container, localhost e o proprio
    # container; host-gateway funciona no Docker Desktop e no Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - forja-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Celery Worker (Background Tasks & Events)
  # ----------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: forja-celery-worker
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    # Sem env_file: mesma regra do backend; apenas variaveis explicitas,
    # nunca credenciais de bootstrap/migracao.
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-forja_app}:${POSTGRES_APP_PASSWORD:-forja_app_secret_dev}@postgres:5432/${POSTGRES_DB:-forja_db}
      REDIS_HOST: redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_HOST: rabbitmq
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required (see .env.example)}
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-forja-backend}-worker
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required (see .env.example)}
      PEPPER: ${PEPPER:?PEPPER is required (see .env.example)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (see .env.example)}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-mailpit}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-1025}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@forja.local}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      EMAIL_DRY_RUN: ${EMAIL_DRY_RUN:-false}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      # Recuperacao de carrinho: kill switch + LLM local (somente leitura).
      AI_AGENTS_ENABLED: ${AI_AGENTS_ENABLED:-false}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:1235/v1}
      LLM_API_KEY: ${LLM_API_KEY:-lm-studio}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.5-9b}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_ROUTER_TIMEOUT_SECONDS: ${LLM_ROUTER_TIMEOUT_SECONDS:-20}
      LLM_ANSWER_TIMEOUT_SECONDS: ${LLM_ANSWER_TIMEOUT_SECONDS:-60}
      LLM_REGENERATION_TIMEOUT_SECONDS: ${LLM_REGENERATION_TIMEOUT_SECONDS:-20}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-1}
      LLM_QUEUE_SIZE: ${LLM_QUEUE_SIZE:-2}
      LLM_QUEUE_TIMEOUT_SECONDS: ${LLM_QUEUE_TIMEOUT_SECONDS:-10}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
      CART_RECOVERY_FREE_SHIPPING_MIN_BRL: ${CART_RECOVERY_FREE_SHIPPING_MIN_BRL:-1500.00}
      CART_RECOVERY_ESCALATE_MIN_BRL: ${CART_RECOVERY_ESCALATE_MIN_BRL:-20000.00}
      CART_RECOVERY_TENANT_BATCH: ${CART_RECOVERY_TENANT_BATCH:-20}
      CART_RECOVERY_CART_BATCH: ${CART_RECOVERY_CART_BATCH:-20}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - forja-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME | grep -q 'pong'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Celery Beat (agendador de tarefas periodicas)
  # ----------------------------------------------------------------------------
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: forja-celery-beat
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-forja_app}:${POSTGRES_APP_PASSWORD:-forja_app_secret_dev}@postgres:5432/${POSTGRES_DB:-forja_db}
      REDIS_HOST: redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_HOST: rabbitmq
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required (see .env.example)}
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-mailpit}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-1025}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@forja.local}
    networks:
      - forja-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    # O schedule fica em tmpfs: o rootfs e somente leitura e o beat nao deve
    # gravar no diretorio da aplicacao (falha observada antes desta mudanca).
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep 'celery.*beat' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Frontend Web (Next.js Standalone)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    container_name: forja-frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - forja-network
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
