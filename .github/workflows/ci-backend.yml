name: CI - Backend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "docker/postgres/**"
      - "docker/otel/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - "docker/postgres/**"
      - "docker/otel/**"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools & Dependencies
        # requirements-dev.txt: ferramentas (ruff, mypy, import-linter) e deps
        # de teste necessarias ao mypy estrito sobre tests/ (psycopg, httpx...).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Mypy Typecheck
        run: mypy .

      - name: Run Import Linter (architecture contracts)
        run: lint-imports --config .import-linter

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    # Os testes de banco usam Testcontainers: PostgreSQL descartavel provisionado
    # pelo proprio pytest com o bootstrap real do projeto (docker/postgres).
    # Nao usamos o service postgres do Actions para evitar validar RLS com um
    # superuser efemero que nao reflete as roles reais do ambiente.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Pytest
        # Sem fallback: falhas reais de teste produzem exit code != 0.
        # Cobertura do pacote app sera reintroduzida pelo @backend-specialist
        # quando o codigo da aplicacao existir.
        run: pytest tests/ -v --tb=short

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Pip-Audit & Bandit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Run Bandit AST Security Scan
        run: |
          bandit -r . -ll -ii -x .venv,tests || true

      - name: Audit Dependencies with pip-audit
        run: |
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt || true; fi

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-24.04
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: forja-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Celery Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: false
          tags: forja-celery-worker:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
