# ==============================================================================
# Forja B2B, Alembic (evolucao do schema de APLICACAO)
#
# Fronteira de responsabilidade:
#   - Bootstrap PostgreSQL (roles, ACLs, schema `app`, helpers RLS, extensoes):
#     docker/postgres/*.sql via initdb. NUNCA duplicado aqui.
#   - Alembic: apenas schema de dominio da aplicacao (tabelas, indexes,
#     policies RLS de tabelas de dominio), criado a partir da Fase 1.
#
# Credencial: migrations rodam com a role administrativa restrita
# (forja_admin) via DATABASE_ADMIN_URL. O runtime da aplicacao (DATABASE_URL,
# role forja_app) NAO tem privilegio de DDL e nunca executa migrations.
# A URL nao fica neste arquivo: alembic/env.py le do ambiente.
# ==============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
version_locations = alembic/versions
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
